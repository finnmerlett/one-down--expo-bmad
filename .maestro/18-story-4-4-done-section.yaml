# Story 4.4 — done section in the task list: completed tasks fill a "Done"
# section at the TOP (headers hidden entirely while nothing is completed —
# that leg lives in flow 06), done rows are display-only plain-text rows
# (todo rows keep the `Open task:` label — full-string selectors can't
# collide), and the entry scroll parks "To do" near the top with the latest
# completions peeking above.
# Seeded (9-5 item 1): Alpha/Beta/Gamma arrive PRE-COMPLETED with staggered
# updatedAt (done section sorts updatedAt ASC — Gamma newest peeks just above
# "To do") via the e2e-done account pull; Delta stays pending. The old
# 90-step complete-three-cards-from-the-deck choreography is gone.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml
- runFlow:
    file: common/sign-in-seeded.yaml
    env:
      EMAIL: 'e2e-done@test.local'

# Delta is the only browsable card — its arrival proves the pull landed
- extendedWaitUntil:
    visible: 'Task: Delta task\..*'
    timeout: 15000

- tapOn: 'Open task list'
- waitForAnimationToEnd

# Done section on top: latest completion (Gamma) peeks above "To do" after
# the entry scroll; Delta stays a pressable To do row (AC1/AC2/AC4/AC5)
- assertVisible: 'Done'
- assertVisible: 'To do'
- assertVisible: 'Gamma task'
- assertVisible: 'Open task: Delta task'
- assertNotVisible: 'Open task: Gamma task'
- assertNotVisible: 'Completed tasks will land here.'
- takeScreenshot: .claude/run-notes/screenshots/4-4-done-section

# Home is intact afterwards — Delta is the whole deck
- tapOn: 'Back to home'
- waitForAnimationToEnd
- assertVisible: 'Task: Delta task\. Worth 5 stars\. Card 1 of 1.*'

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
