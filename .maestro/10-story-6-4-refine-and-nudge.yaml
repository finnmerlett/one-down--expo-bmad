# Story 6.4 → v1.5 D4 — 'Change' on the working screen opens the dashed
# WHAT SHOULD BE DIFFERENT box, the submit rewrites only the UNCOMPLETED
# steps DIRECTLY (no proposal), the distillation lands in the notes, and the
# label line reports the change with Undo (AC1–AC4). A skip-flagged card
# surfaces the E9 nudge — one tap fetches the smallest step, saves it, and
# opens the working screen (AC5–AC6). Deterministic fake provider (AC7).
# Fake-provider contract (fake-provider.ts — lockstep with this flow):
#   refine steps: the three first_steps starters prefixed 'Refined: '
#   distillation: 'Approach note: ' + trimmed feedback (capped at 140 chars)
#   learning:     feedback containing 'prefer' → 'Learned: ' + trimmed
#                 feedback (9-5 item 4) — lands in the settings AI notes
#   micro step:   Do just the very first minute of "<title>"
# Prereq (batched wave-end run): local server running WITHOUT GEMINI_API_KEY
# (fake mode) and the APK built with EXPO_PUBLIC_API_URL=http://10.0.2.2:3002
# (Story 5.1).
# Seeded (9-5 item 1): paperwork (quick win — momentum pins it on top) +
# council pre-skipped to the nudge threshold (skipCount 5), so ONE swipe
# surfaces the E9 nudge instead of the old ten-swipe loop.
# 3.3-proofing: card taps use PREFIX regex ('Task: <title>\..*') — the
# pre-skipped council card can carry a coin-flip offer badge suffix.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml
- runFlow:
    file: common/sign-in-seeded.yaml
    env:
      EMAIL: 'e2e-refine@test.local'
- extendedWaitUntil:
    visible: 'Task: Sort the paperwork mountain\..*'
    timeout: 15000

# --- Leg 1: Change rewrites the uncompleted steps (AC1–AC4) ---

# Open the working screen and land the first three steps (D4 direct)
- tapOn: 'Task: Sort the paperwork mountain\..*'
- waitForAnimationToEnd
- tapOn: 'More steps'
- extendedWaitUntil:
    visible: 'Subtask: Do just the first two minutes'
    timeout: 15000

# Tick the FIRST subtask — it must survive the change untouched (UX-DR7)
- tapOn: 'Subtask: Get everything you need for "Sort the paperwork mountain" in one place'
- assertVisible:
    text: 'Subtask: Get everything you need for "Sort the paperwork mountain" in one place'
    checked: true

# 'Change' opens the dashed box (05c); the same button (now filled with
# a check) submits the typed feedback (05d).
- tapOn: 'Change'
- assertVisible: "Say what's off in your own words"
- tapOn: 'What should be different'
# 'prefer' triggers the fake provider's general learning (9-5 item 4) — the
# distillation AND the settings-notes assert at the end both key off this.
- inputText: 'I prefer physical actions I can tick off'
- tapOn: 'Change'

# The 'Working' spinner state is NOT asserted: even with its 500ms minimum
# visible duration, Maestro's hierarchy polls on a release build can miss the
# window entirely. Assert only the settled result.

# The rewrite lands DIRECTLY: uncompleted rows replaced, completed kept (AC4)
- extendedWaitUntil:
    visible: 'Subtask: Refined: Do just the first two minutes'
    timeout: 15000
# The refine's ADDED step takes the list past 3 — the collapsed window
# hides the tail; show the whole list before asserting it.
- tapOn: 'Show all steps'
- assertVisible: 'Subtask: Refined: Set a 10-minute timer and keep going'
- assertVisible:
    text: 'Subtask: Get everything you need for "Sort the paperwork mountain" in one place'
    checked: true
# Full-string regex: the old uncompleted rows are gone ('Subtask: Refined: …'
# does NOT match this pattern)
- assertNotVisible: 'Subtask: Do just the first two minutes'
- assertNotVisible: 'Subtask: Set a 10-minute timer and keep going'

# The label line reports the diff (2 uncompleted → 3 refined) with Undo (05e)
- assertVisible: '1 ADDED · 2 CHANGED'
- assertVisible: 'Undo step changes'
- takeScreenshot: .maestro/screenshots/10-story-6-4-changed-steps

# The distillation was appended to the notes immediately (AC3 — visible via
# the draft-or-stored resync; notes were empty, so it is the whole value)
- assertVisible: 'Approach note: I prefer physical actions I can tick off'

# --- Leg 2: pre-skipped card → one-tap smallest step (AC5–AC6) ---

- tapOn: 'Pause and go back'
- waitForAnimationToEnd

# The council card was seeded AT the skip threshold — one swipe past the
# paperwork card (in_progress — no nudge) surfaces it with the E9 nudge.
- runFlow:
    when:
      notVisible: 'Task: Ring the council office\..*'
    commands:
      - swipe:
          start: 80%, 45%
          end: 5%, 45%
      - waitForAnimationToEnd

# The E9 nudge floats under the stack for the skipped top card (AC5). One tap
# costs no decisions: fetch the smallest step, save it, open the working
# screen with it in the list (AC6).
- assertVisible: 'This one keeps coming back round.'
- tapOn: 'Show me the smallest step'
- extendedWaitUntil:
    visible: 'Subtask: Do just the very first minute of "Ring the council office"'
    timeout: 15000

# --- Leg 3: the general learning landed in the editable settings notes (9-5 item 4) ---

- tapOn: 'Pause and go back'
- waitForAnimationToEnd
- tapOn: 'Open settings'
- waitForAnimationToEnd
- assertVisible: 'AI notes about you'
- assertVisible: '.*Learned: I prefer physical actions I can tick off.*'
- takeScreenshot: .maestro/screenshots/10-95-ai-notes-learning

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
