# Story 6.2 → v1.5 D6b — the check queue: brain-dumped tasks with AI guesses
# carry the info marker (AC1); 'Needs review' opens the blueprint Triage
# screen (review MODE is retired); the flagged card shows WE GUESSED groups
# and the NOTHING TO GO ON deadline gap; None + Save and next confirms it as
# shown; emptying the queue pays the +5 (once per local day).
# Fake-provider contract for the dump below (fake-provider.ts):
#   'Call the dentist soon'  → phone context + quick_win (≤5 words) inferred,
#                              'soon' → timeSensitive with no date → missingDeadline
#   'Ponder the universe quietly for a while' → nothing inferred (unflagged)
# Prereq (batched wave-end run): local server running WITHOUT GEMINI_API_KEY
# (fake mode) and the APK built with EXPO_PUBLIC_API_URL=http://10.0.2.2:3000.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml

# Seed via brain dump (6.1 surface + D6a gate)
- tapOn: 'Brain dump'
- waitForAnimationToEnd
- tapOn: "What's on your mind?"
- inputText: 'Call the dentist soon. Ponder the universe quietly for a while'
- tapOn: 'Parse my tasks'
- extendedWaitUntil:
    visible: 'Check these 2'
    timeout: 15000
- tapOn: 'Add 2 tasks'
- extendedWaitUntil:
    visible: 'Task: (Call the dentist soon|Ponder the universe quietly for a while)\..* Card . of 2.*'
    timeout: 15000

# The review entry only exists on a flagged TOP card — cycle once if the
# unflagged card happened to surface first (3.3's curation order is seeded).
- runFlow:
    when:
      notVisible: 'Needs review'
    commands:
      - swipe:
          start: 80%, 45%
          end: 5%, 45%
      - waitForAnimationToEnd
- assertVisible: 'Needs review'

# Enter the queue: blueprint Triage screen with the one flagged card (D6b)
- tapOn: 'Needs review'
- waitForAnimationToEnd
- assertVisible: 'Triage'
- assertVisible: '1 / 1'
- assertVisible: 'We guessed'
- assertVisible: 'Nothing to go on'
- takeScreenshot: .maestro/screenshots/23-story-6-2-triage-blueprint

# Answer the deadline gap with None, then save the card AS SHOWN — the
# remaining guesses (size, contexts) confirm in one go (AC4/AC6)
- tapOn: 'No deadline needed'
- tapOn: 'Save and next'

# Last card saved → the queue-clear state; +5 landed (once/day, Row E)
- extendedWaitUntil:
    visible: 'Queue clear'
    timeout: 5000
- waitForAnimationToEnd
- tapOn: 'Back to the deck'
# The tap can land the frame the completion view mounts and get dropped —
# press again if we are still on the triage screen.
- runFlow:
    when:
      visible: 'Back to the deck'
    commands:
      - waitForAnimationToEnd
      - tapOn: 'Back to the deck'
- waitForAnimationToEnd
# The star counter exposes ONE accessible label (total + today, cf. flows
# 16/17) — the visible '+5 today' chip is not reachable through it.
- extendedWaitUntil:
    visible: '5 stars, 5 earned today'
    timeout: 5000
- assertNotVisible: 'Needs review'

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
