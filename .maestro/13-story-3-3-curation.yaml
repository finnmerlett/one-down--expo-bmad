# Story 3.3 — stack curation: the momentum rule puts the best quick win on
# top despite the random session seed (AC1a), and every card front announces
# its potential star value — quick win 5 (base), big time 20 (size bonus)
# (AC2). The urgent-context indicator dot (AC3) is NOT E2E-drivable here —
# it is covered by unit tests and the WithUrgentDot story instead.
# Seeded (9-5 item 1): both sized fixtures arrive via the e2e-curation
# account pull.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml
- runFlow:
    file: common/sign-in-seeded.yaml
    env:
      EMAIL: 'e2e-curation@test.local'

# AC1a momentum: the quick win lands on top of the mix, card 1
- extendedWaitUntil:
    visible: 'Task: Tiny task. Worth 5 stars. Card 1 of 2'
    timeout: 15000

# AC2: the big task's star value is 20 (size bonus) — deterministic despite
# the random session seed (no deadlines -> no urgency bonus)
- swipe:
    start: 80%, 45%
    end: 5%, 45%
- waitForAnimationToEnd
- assertVisible: 'Task: Huge task. Worth 20 stars. Card 2 of 2'
- takeScreenshot: .claude/run-notes/screenshots/3-3-star-value-chip

# Wrap around — the quick win is card 1 again (momentum, AC1a)
- swipe:
    start: 80%, 45%
    end: 5%, 45%
- waitForAnimationToEnd
- assertVisible: 'Task: Tiny task. Worth 5 stars. Card 1 of 2'

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
