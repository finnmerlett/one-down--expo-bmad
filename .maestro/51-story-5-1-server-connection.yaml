# Story 5.1 — mobile-to-server connection: the home screen's ConnectionStatus
# dot reaches 'connected' via the tRPC health query.
# PREREQ: `bun run server:dev` running on the host (the emulator reaches it at
# http://10.0.2.2:3000; release APK allows cleartext via expo-build-properties).
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml

# The health query resolves against the host server within the 5s fetch timeout.
- extendedWaitUntil:
    visible: 'Server connection: connected'
    timeout: 10000
- takeScreenshot: .maestro/screenshots/5-1-server-connected

# Home stays intact around the indicator.
- assertVisible: 'Add task'
- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
