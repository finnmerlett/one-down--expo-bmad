# Story 4.1 — star earning system: completing a task persists a star
# transaction and the toast shows the ACTUAL calculated amount (a quick win
# with no deadline earns exactly the base 5 — AC6, deterministic); cutting
# loose awards the smaller flat amount (AC3).
# Seeded (9-5 item 1): both subjects arrive via the e2e-stars account pull
# (stars themselves are local — they are still earned in-app, which IS the
# story under test). The quick win pins leg 1's subject on top.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml
- runFlow:
    file: common/sign-in-seeded.yaml
    env:
      EMAIL: 'e2e-stars@test.local'

# --- Leg 1: completion award (base amount, no deadline) ---
- extendedWaitUntil:
    visible: 'Task: Earn stars task. Worth 5 stars. Card 1 of 2'
    timeout: 15000
- tapOn: 'Task: Earn stars task. Worth 5 stars. Card 1 of 2'
- waitForAnimationToEnd
# Assert the toast fast — it auto-dismisses after ~2 s
- tapOn: 'Mark as complete'
- assertVisible: 'One down!'
- assertVisible: '+5 · 5 TOTAL'
- takeScreenshot: .claude/run-notes/screenshots/4-1-star-toast

# --- Leg 2: cut-loose award (flat, smaller than completion) ---
- extendedWaitUntil:
    visible: 'Task: Let go task. Worth 5 stars. Card 1 of 1'
    timeout: 5000
- tapOn: 'Task: Let go task. Worth 5 stars. Card 1 of 1'
- waitForAnimationToEnd
- tapOn: 'Cut it loose'
- assertVisible: 'Released'
- assertVisible: '+3 stars'

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
