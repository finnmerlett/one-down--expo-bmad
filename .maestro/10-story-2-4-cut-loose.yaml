# Story 2.4 → v1.5 D5 — cut loose a task: frictionless guilt-free release.
# The card back lost its Cut loose button (D5) — the working screen owns the
# release now (triage and the 7.2 health prompt are the other paths). The
# release shows the "Released" toast with the cut-loose stars, the released
# task appears in NEITHER task-list section but DOES sit in the recycle bin,
# and home shows the empty-browse state once everything is released.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml

# --- Release from the working screen ---
- runFlow:
    file: common/add-task.yaml
    env:
      TITLE: 'Release from running'
- tapOn: 'Task: Release from running. Worth 5 stars. Card 1 of 1'
- waitForAnimationToEnd
- tapOn: 'Cut it loose'
# Assert the toast fast — it auto-dismisses after ~2 s
- assertVisible: 'Released'
- assertVisible: '+3 stars'
- takeScreenshot: .claude/run-notes/screenshots/2-4-released-toast
# Back on home, the released card is gone (AC5)
- extendedWaitUntil:
    visible: 'All clear'
    timeout: 5000
- assertNotVisible: 'Release from running'

# --- Released tasks live in the recycle bin, not the list (AC7) ---
- tapOn: 'Open task list'
- waitForAnimationToEnd
- assertVisible: 'No tasks yet'
- assertNotVisible: 'Open task: Release from running'
- tapOn: 'Tab: Recycle bin'
- waitForAnimationToEnd
- assertVisible: 'Release from running'
- assertVisible: 'Cut loose'

# --- Home still shows the empty-browse state (AC2 tail) ---
- tapOn: 'Back to home'
- waitForAnimationToEnd
- assertVisible: 'All clear'

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
