# Undo-complete (2026-07-27, remote request) — a Done row's Undo button flips
# the task back to To do and retracts the completion stars: the star counter
# returns to its pre-completion value and the star log shows a neutral
# "Marked not done" retraction row.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml

- runFlow:
    file: common/add-task.yaml
    env:
      TITLE: 'Undo me'

# Complete it via the running screen (2.3 path)
- tapOn: 'Task: Undo me. Worth 5 stars. Card 1 of 1'
- waitForAnimationToEnd
- tapOn: 'Mark as complete'
- assertVisible: 'One down!'
- extendedWaitUntil:
    visible: '5 stars, 5 earned today'
    timeout: 5000

# Done section shows the row with its Undo affordance. The completion toast
# overlaps the top bar and eats taps — let it expire first.
- extendedWaitUntil:
    notVisible: 'One down!'
    timeout: 8000
- tapOn: 'Open task list'
- waitForAnimationToEnd
- assertVisible: 'Done'
- assertVisible: 'Undo me'
- tapOn: 'Undo completion: Undo me'

# Toast is honest about the star cost, row is a To do row again, Done section
# collapses (it was the only completed task)
- assertVisible: 'Marked as not done — ★5 removed'
- extendedWaitUntil:
    visible: 'Open task: Undo me'
    timeout: 5000
- assertNotVisible: 'Done'

# Star counter is back to zero on home; the card is back in the stack
- tapOn: 'Back to home'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Task: Undo me. Worth 5 stars. Card 1 of 1'
    timeout: 5000
- assertVisible: '0 stars, 0 earned today'

# Star log: the award was REMOVED (owner decision) — an undone completion
# leaves no trace, so the log is back to its empty state.
- tapOn: '0 stars, 0 earned today'
- waitForAnimationToEnd
- assertNotVisible: 'Completed · Undo me'
- assertNotVisible: 'Marked not done · Undo me'
- assertVisible: 'No stars yet'

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
