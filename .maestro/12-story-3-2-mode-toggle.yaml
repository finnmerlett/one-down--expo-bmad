# Story 3.2 — mode toggle: Quick wins / Big time segmented control re-curates
# the stack to the matching size (AC2/AC3), the explicit 'Mode: All' segment
# clears the mode and both sizes return (AC4 — v1.5: re-pressing an active
# mode no longer deactivates it), and mode combines with the context filter
# with AND semantics (AC5).
# Seeded (9-5 item 1): 'Tiny chore' (quick win — momentum pins it on top) and
# 'Giant project' (big time) arrive pre-sized via the e2e-modes account pull;
# the Home tag for AC5 is still applied in-flow (context editing is cheap).
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml
- runFlow:
    file: common/sign-in-seeded.yaml
    env:
      EMAIL: 'e2e-modes@test.local'
- extendedWaitUntil:
    visible: 'Task: Tiny chore. Worth 5 stars. Card 1 of 2'
    timeout: 15000

# AC2: Quick wins mode leaves only the quick-win task
- tapOn: 'Mode: Quick wins'
- assertVisible: 'Task: Tiny chore. Worth 5 stars. Card 1 of 1'
- takeScreenshot: .claude/run-notes/screenshots/3-2-quick-wins-mode

# AC3: Big time mode swaps to the big task
- tapOn: 'Mode: Big time'
- assertVisible: 'Task: Giant project. Worth 20 stars. Card 1 of 1'

# AC4: the 'Mode: All' segment clears the mode — both sizes return
# (v1.5: re-pressing an active mode no longer deactivates it; 'Mode: All'
# is the explicit clear. The momentum rule puts the quick win back on top.)
- tapOn: 'Mode: All'
- assertVisible: 'Task: Tiny chore. Worth 5 stars. Card 1 of 2'

# AC5 combined: isolate Tiny chore via Quick wins mode, tag it Home, then
# filter Home + Quick wins -> only the task matching BOTH remains
- tapOn: 'Mode: Quick wins'
- tapOn: 'Edit task: Tiny chore'
- waitForAnimationToEnd
- tapOn: 'Context: Home'
- tapOn: 'Back to card front'
- waitForAnimationToEnd
# (v1.5: context chips live in the expandable Right-now sheet)
- tapOn: 'Right now.*'
- tapOn: 'Filter context: Home'
- tapOn: 'Done choosing contexts'
- waitForAnimationToEnd
- assertVisible: 'Task: Tiny chore. Worth 5 stars. Card 1 of 1'

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
