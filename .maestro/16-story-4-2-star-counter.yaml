# Story 4.2 — star counter display: the top-bar box shows grand total plus
# today's earnings together (zeros on a fresh install, AC4) and updates LIVE
# when a completion award lands — no refresh, no navigation (AC2). Amount is
# deterministic: no size/deadline -> base 10 (4.1 AC6).
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml

# Fresh install: real zeros, never blank (AC4). Selector = full a11y label —
# the Pressable collapses inner text (AC3 label shape).
- assertVisible: '0 stars, 0 earned today'

# Earn a deterministic base award
- runFlow:
    file: common/add-task.yaml
    env:
      TITLE: 'Counter task'
- tapOn: 'Task: Counter task. Worth 10 stars. Card 1 of 1'
- waitForAnimationToEnd
- tapOn: 'Start task'
- waitForAnimationToEnd
- tapOn: 'Done'
- waitForAnimationToEnd

# Back on home the counter live-updated — total AND today together (AC1/AC2)
- extendedWaitUntil:
    visible: '10 stars, 10 earned today'
    timeout: 5000
- takeScreenshot: .claude/run-notes/screenshots/4-2-star-counter

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
