# Story 6.1 — brain dump: the standing 'Brain dump' pill (v1.5, no FAB) opens
# the brain dump screen (UX-DR15), submitting a dump creates one local task
# per extracted item via the server's ai.parseBrainDump (deterministic fake
# provider), and quick add stays reachable through 'Add one task instead'.
# Prereq (batched wave-end run): local server running WITHOUT GEMINI_API_KEY
# (fake mode) and the APK built with EXPO_PUBLIC_API_URL=http://10.0.2.2:3000
# (Story 5.1).
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml

# The 'Brain dump' pill opens the brain dump screen (AC1)
- tapOn: 'Brain dump'
- waitForAnimationToEnd
- assertVisible: "What's on your mind?"

# Alternative leg: 'Add one task instead' returns home and opens the
# quick-add sheet (AC1)
- tapOn: 'Add one task instead'
- waitForAnimationToEnd
- assertVisible: 'Task title'
- tapOn: 'Close add task'
- waitForAnimationToEnd

# Main leg: submit a dump. Fake-provider contract: segments split on '.',
# 'call' → phone context, 'tomorrow' → deadline tomorrow 18:00,
# 'clean' → home context (AC2/AC4/AC6)
- tapOn: 'Brain dump'
- waitForAnimationToEnd
# Focus the textarea by its placeholder — 'Brain dump' is ambiguous on this
# screen (heading + textarea share the label; Maestro would tap the heading)
- tapOn: "What's on your mind?"
- inputText: 'Call the dentist tomorrow. Clean out the garage'
- tapOn: 'Parse my tasks'

# Parse + local creation + pop home. Card labels are matched by PREFIX regex
# (3.3 adds 'Worth N stars' and seed-jittered ordering — the top card is
# whichever parsed task curation surfaced), so we only assert that a parsed
# card is on top of a 2-card stack.
- extendedWaitUntil:
    visible: 'Task: (Call the dentist tomorrow|Clean out the garage)\..* Card . of 2.*'
    timeout: 15000
- takeScreenshot: .maestro/screenshots/08-story-6-1-brain-dump-stack

# Both parsed tasks exist — asserted order-independently via the task list
- tapOn: 'Open task list'
- waitForAnimationToEnd
- assertVisible: 'Open task: Call the dentist tomorrow'
- assertVisible: 'Open task: Clean out the garage'
- tapOn: 'Back to home'
- waitForAnimationToEnd

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
