# Shared subflow — seed ONE task through the quick-add UI.
# v1.5 navigation: the plus circle ('Add a task') opens the quick-add sheet
# directly. Ends back on the home stack with the sheet closed.
# Usage:
#   - runFlow:
#       file: common/seed-task.yaml
#       env:
#         TASK_TITLE: 'My task title'
appId: com.onedown.mobile
---
- tapOn: 'Add a task'
- waitForAnimationToEnd
- tapOn: 'Task title'
- inputText: ${TASK_TITLE}
- tapOn: 'Save task'
# The input clears back to its placeholder once the save lands
- extendedWaitUntil:
    visible: 'What needs doing?'
    timeout: 3000
- tapOn: 'Close add task'
- waitForAnimationToEnd
