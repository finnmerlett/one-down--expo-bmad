# Shared seeding subflow — creates one task through the quick-add UI and
# closes the sheet. Parameterized: pass the task title via runFlow env:
#
#   - runFlow:
#       file: common/add-task.yaml
#       env:
#         TITLE: 'My task title'
appId: com.onedown.mobile
---
- tapOn: 'Add task'
- waitForAnimationToEnd
- tapOn: 'Task title'
- inputText: ${TITLE}
- tapOn: 'Save task'
- extendedWaitUntil:
    visible: 'What needs doing?'
    timeout: 3000
- tapOn: 'Close add task'
- waitForAnimationToEnd
