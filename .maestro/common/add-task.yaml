# Shared seeding subflow — creates one task through the quick-add UI and
# closes the sheet. Post-6.1 navigation: the FAB ('Add task') opens the brain
# dump screen; the quick-add sheet is reached via 'Add one task instead'.
# Parameterized: pass the task title via runFlow env:
#
#   - runFlow:
#       file: common/add-task.yaml
#       env:
#         TITLE: 'My task title'
appId: com.onedown.mobile
---
- tapOn: 'Add task'
- waitForAnimationToEnd
- tapOn: 'Add one task instead'
- waitForAnimationToEnd
- tapOn: 'Task title'
- inputText: ${TITLE}
- tapOn: 'Save task'
- extendedWaitUntil:
    visible: 'What needs doing?'
    timeout: 3000
- tapOn: 'Close add task'
- waitForAnimationToEnd
