# Shared seeding subflow — creates one task through the quick-add UI and
# closes the sheet. v1.5 navigation: the plus circle ('Add a task') opens the
# quick-add sheet directly; 'Brain dump' has its own standing pill.
# Parameterized: pass the task title via runFlow env:
#
#   - runFlow:
#       file: common/add-task.yaml
#       env:
#         TITLE: 'My task title'
appId: com.onedown.mobile
---
- tapOn: 'Add a task'
- waitForAnimationToEnd
- tapOn: 'Task title'
- inputText: ${TITLE}
- tapOn: 'Save task'
- extendedWaitUntil:
    visible: 'What needs doing?'
    timeout: 3000
- tapOn: 'Close add task'
- waitForAnimationToEnd
