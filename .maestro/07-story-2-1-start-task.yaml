# Story 2.1 (revised 2026-07-27) — tapping a card opens the WORKING screen
# directly, without starting the task: just looking leaves no Continue chip.
# The pending → in_progress transition (and the Continue marker it drives)
# fires on the first meaningful action — here, typing a note. Notes typed on
# the working screen are verified AFTER leaving and re-entering — proves
# persistence via the flush.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml

# Seed one task via quick add (v1.5: the plus circle opens the sheet directly)
- tapOn: 'Add a task'
- waitForAnimationToEnd
- tapOn: 'Task title'
- inputText: 'Start me task'
- tapOn: 'Save task'
- extendedWaitUntil:
    visible: 'What needs doing?'
    timeout: 3000
- tapOn: 'Close add task'
- waitForAnimationToEnd

# Tap the card -> working screen directly (2026-07-27 UX)
- tapOn: 'Task: Start me task. Worth 5 stars. Card 1 of 1'
- waitForAnimationToEnd

# Working screen: title, notes area, action row
- assertVisible: 'Start me task'
- assertVisible: 'Notes'
- assertVisible: 'Mark as complete'
- assertVisible: 'More steps'
- assertVisible: 'Cut it loose'

# Just looking is NOT starting: leave untouched -> no Continue marker
- tapOn: 'Pause and go back'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Task: Start me task. Worth 5 stars. Card 1 of 1'
    timeout: 3000
- assertNotVisible: 'In progress'

# Re-enter and add a working note, then leave WITHOUT blurring the field —
# the note must survive via the beforeRemove flush, not the onBlur save
- tapOn: 'Task: Start me task. Worth 5 stars. Card 1 of 1'
- waitForAnimationToEnd
- tapOn: 'Task notes'
- inputText: 'Halfway through the pile'
- tapOn: 'Pause and go back'
- waitForAnimationToEnd

# Altering the task from the working screen counts as starting it -> the
# card front now shows the In-progress chip (v1.5 copy)
- extendedWaitUntil:
    visible: 'Task: Start me task. Worth 5 stars. Card 1 of 1'
    timeout: 3000
- assertVisible: 'In progress'

# Tap again -> working screen reopens with the note preserved
- tapOn: 'Task: Start me task. Worth 5 stars. Card 1 of 1'
- waitForAnimationToEnd
- assertVisible: 'Halfway through the pile'

# Hardware back also leaves cleanly — home stack intact, still marked
- back
- waitForAnimationToEnd
- assertVisible: 'Task: Start me task. Worth 5 stars. Card 1 of 1'
- assertVisible: 'In progress'

# Second surface: task list → row tap lands on the WORKING screen in its
# looking state (2026-08-11: viewing, not editing) — 'In progress' chip
# already earned from the first leg; the editor lives behind the pencil.
- tapOn: 'Open task list'
- waitForAnimationToEnd
- tapOn: 'Open task: Start me task'
- waitForAnimationToEnd
- assertVisible: 'Mark as complete'
- tapOn: 'Edit task: Start me task'
- waitForAnimationToEnd
- assertVisible: 'Editing card'
- assertVisible: 'Done editing'

# Unwind to home: editor → working screen → list → home
- back
- waitForAnimationToEnd
- back
- waitForAnimationToEnd
- back
- waitForAnimationToEnd
- assertVisible: 'Add a task'

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
