# Story 1.3 — card stack: stack renders with a11y announcement, swipe
# advances, list changes keep position (AC7), wrap-around (AC6), snap-back
# (AC5). The top card is an accessible container, so assertions target its
# full label ("Task: <title>. Worth N stars. Card X of Y"), not the inner
# title text.
# Updated for Story 3.3: curation order is seed-jittered, so 'Stack task
# beta' is sized Quick win while it is the only card — the momentum rule then
# deterministically pins it as the top card. Positions of the unsized tasks
# vary by session seed and are matched by regex where needed.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml

# Seed beta and make it a quick win (only card -> deterministically on top)
- runFlow:
    file: common/add-task.yaml
    env:
      TITLE: 'Stack task beta'
- tapOn: 'Task: Stack task beta. Worth 10 stars. Card 1 of 1'
- waitForAnimationToEnd
- tapOn: 'Size: Quick win'
- tapOn: 'Back to card front'
- waitForAnimationToEnd

# Seed alpha; the momentum rule keeps the quick win beta as the top card
- runFlow:
    file: common/add-task.yaml
    env:
      TITLE: 'Stack task alpha'
- assertVisible: 'Task: Stack task beta. Worth 10 stars. Card 1 of 2'

# Swipe left past the dismiss threshold -> alpha becomes top
- swipe:
    start: 80%, 45%
    end: 5%, 45%
- waitForAnimationToEnd
- assertVisible: 'Task: Stack task alpha. Worth 10 stars. Card 2 of 2'

# AC7: adding a task mid-browse must NOT reset the position — gamma joins the
# deck, but alpha stays the top card (its index depends on the session seed)
- runFlow:
    file: common/add-task.yaml
    env:
      TITLE: 'Stack task gamma'
- assertVisible: 'Task: Stack task alpha. Worth 10 stars. Card [23] of 3'

# Wrap-around: three swipes cycle the whole 3-card deck back to alpha
# (no dead end past the last card)
- swipe:
    start: 80%, 45%
    end: 5%, 45%
- waitForAnimationToEnd
- swipe:
    start: 80%, 45%
    end: 5%, 45%
- waitForAnimationToEnd
- swipe:
    start: 80%, 45%
    end: 5%, 45%
- waitForAnimationToEnd
- assertVisible: 'Task: Stack task alpha. Worth 10 stars. Card [23] of 3'

# Below-threshold drag snaps back: top card unchanged
- swipe:
    start: 60%, 45%
    end: 45%, 45%
- waitForAnimationToEnd
- assertVisible: 'Task: Stack task alpha. Worth 10 stars. Card [23] of 3'

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
