# Story 1.3 — card stack: stack renders with a11y announcement, swipe
# advances, list changes keep position (AC7), wrap-around (AC6), snap-back
# (AC5). The top card is an accessible container, so assertions target its
# full label ("Task: <title>. Worth N stars. Card X of Y"), not the inner
# title text.
# Seeded (9-5 item 1): beta (quick win — the momentum rule pins it on top
# despite the session seed) + alpha arrive via the e2e-stack account pull.
# Gamma is still added through the UI below: mid-browse add IS the AC.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml
- runFlow:
    file: common/sign-in-seeded.yaml
    env:
      EMAIL: 'e2e-stack@test.local'
- extendedWaitUntil:
    visible: 'Task: Stack task beta. Worth 5 stars. Card 1 of 2'
    timeout: 15000

# Swipe left past the dismiss threshold -> alpha becomes top
- swipe:
    start: 80%, 45%
    end: 5%, 45%
- waitForAnimationToEnd
- assertVisible: 'Task: Stack task alpha. Worth 5 stars. Card 2 of 2'

# AC7: adding a task mid-browse must NOT reset the position — gamma joins the
# deck, but alpha stays the top card (its index depends on the session seed)
- runFlow:
    file: common/add-task.yaml
    env:
      TITLE: 'Stack task gamma'
- assertVisible: 'Task: Stack task alpha. Worth 5 stars. Card [23] of 3'

# Wrap-around: three swipes cycle the whole 3-card deck back to alpha
# (no dead end past the last card)
- swipe:
    start: 80%, 45%
    end: 5%, 45%
- waitForAnimationToEnd
- swipe:
    start: 80%, 45%
    end: 5%, 45%
- waitForAnimationToEnd
- swipe:
    start: 80%, 45%
    end: 5%, 45%
- waitForAnimationToEnd
- assertVisible: 'Task: Stack task alpha. Worth 5 stars. Card [23] of 3'

# Below-threshold drag snaps back: top card unchanged
- swipe:
    start: 58%, 45%
    end: 51%, 45%
- waitForAnimationToEnd
- assertVisible: 'Task: Stack task alpha. Worth 5 stars. Card [23] of 3'

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
