# Story 6.3 → v1.5 D4 — AI steps land DIRECTLY: 'More steps' on the
# working screen asks ai.breakdownTask (zero steps → the three starters) or
# ai.moreSteps (existing steps → three appended continuations), the result
# auto-accepts into the live subtask list with a report line + Undo — no
# proposal ceremony. Row deletion lives in edit mode (Edit chip). The
# card-back "Help me with this" entry auto-fires the same request (AC6).
# Fake-provider contract (fake-provider.ts — lockstep with this flow):
#   first_steps: Get everything you need for "<title>" in one place /
#     Do just the first two minutes / Set a 10-minute timer and keep going
#   moreSteps (≥2 uncompleted → appended): Carry on with the next small piece /
#     Check what is still missing / Line up the step after that
# Prereq (batched wave-end run): local server running WITHOUT GEMINI_API_KEY
# (fake mode) and the APK built with EXPO_PUBLIC_API_URL=http://10.0.2.2:3000
# (Story 5.1).
# 3.3-proofing: card labels are matched by PREFIX regex ('Task: <title>\..*')
# so Story 3.3's label extension ("Worth n stars") cannot break this flow, and
# each stage relaunches with clearState + seeds exactly ONE task so 3.3's
# randomized curation ordering can never decide which card is on top.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml
- runFlow:
    file: common/seed-task.yaml
    env:
      TASK_TITLE: 'Sort the paperwork mountain'

# Open the working screen (2026-07-27 UX: card tap lands here directly)
- tapOn: 'Task: Sort the paperwork mountain\..*'
- waitForAnimationToEnd

# First ask (zero steps): the three starters land DIRECTLY as subtasks (D4).
# The 'Working' spinner state is NOT asserted: against the instant local fake
# provider it renders for ~500ms and Maestro's hierarchy poll can miss it.
- tapOn: 'More steps'
- extendedWaitUntil:
    visible: 'Subtask: Do just the first two minutes'
    timeout: 15000
- assertVisible: 'Subtask: Set a 10-minute timer and keep going'

# The label line reports the change with its Undo (05e)
- assertVisible: '3 ADDED'
- assertVisible: 'Undo step changes'
- takeScreenshot: .maestro/screenshots/09-story-6-3-direct-steps

# Second ask (steps exist): ai.moreSteps appends three continuations.
# Past 3 steps the list collapses to the current-step window — the All
# toggle appearing doubles as the wait for the results landing.
- tapOn: 'More steps'
- extendedWaitUntil:
    visible: 'Show all steps'
    timeout: 15000
- tapOn: 'Show all steps'
- extendedWaitUntil:
    visible: 'Subtask: Carry on with the next small piece'
    timeout: 15000
- assertVisible: 'Subtask: Line up the step after that'

# Tick a subtask — checked state is exposed via accessibility (AC4)
- tapOn: 'Subtask: Do just the first two minutes'
- assertVisible:
    text: 'Subtask: Do just the first two minutes'
    checked: true

# Leave mid-task and come back (pause/continue) — the tick persisted (AC4)
- tapOn: 'Pause and go back'
- waitForAnimationToEnd
- tapOn: 'Task: Sort the paperwork mountain\..*'
- waitForAnimationToEnd
- assertVisible:
    text: 'Subtask: Do just the first two minutes'
    checked: true

# Delete a subtask — bins live in edit mode now (D4 05a): Edit chip in,
# bin tap removes the row (undo toast appears), Done chip out.
- tapOn: 'Edit steps'
- tapOn: 'Delete subtask: Set a 10-minute timer and keep going'
- assertNotVisible: 'Subtask: Set a 10-minute timer and keep going'
- assertVisible: 'Step removed'
- tapOn: 'Done editing'
- waitForAnimationToEnd

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
