# Story 3.1 — context toggle bar: tapping a context filter immediately
# re-filters the stack (AC2), multi-select shows tasks matching ANY active
# context (AC3), empty contexts grey out while OFF (AC4), and the selection
# persists across an app restart (AC5).
# Seeded (9-5 item 1): 'Water plants' (Home + quick win — momentum pins it on
# top) and 'Email plumber' (Phone) arrive pre-tagged via the e2e-contexts
# account pull — the old edit-and-tag contortions are gone.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml
- runFlow:
    file: common/sign-in-seeded.yaml
    env:
      EMAIL: 'e2e-contexts@test.local'
- extendedWaitUntil:
    visible: 'Task: Water plants. Worth 5 stars. Card 1 of 2'
    timeout: 15000

# AC2: filtering to Home leaves only the Home-tagged task, immediately
# (v1.5: context chips live in the expandable Right-now sheet — open it,
# toggle, then collapse before reading the deck)
- tapOn: 'Right now.*'
- tapOn: 'Filter context: Home'
- tapOn: 'Done choosing contexts'
- waitForAnimationToEnd
- assertVisible: 'Task: Water plants. Worth 5 stars. Card 1 of 1'
- takeScreenshot: .claude/run-notes/screenshots/3-1-context-filtered

# AC3 multi-select: adding Phone brings both back (quick win on top)
- tapOn: 'Right now.*'
- tapOn: 'Filter context: Phone'
- tapOn: 'Done choosing contexts'
- waitForAnimationToEnd
- assertVisible: 'Task: Water plants. Worth 5 stars. Card 1 of 2'

# Un-tap Home -> only the Phone-tagged task remains
- tapOn: 'Right now.*'
- tapOn: 'Filter context: Home'

# AC4: a context with no matching browsable tasks is disabled while OFF
# (chip state is asserted while the sheet is still open)
- assertVisible:
    text: 'Filter context: Laptop'
    enabled: false
- tapOn: 'Done choosing contexts'
- waitForAnimationToEnd
- assertVisible: 'Task: Email plumber. Worth 5 stars. Card 1 of 1'

# AC5: the selection persists across a restart (plain relaunch, NO clearState)
# (v1.5: the Right-now sheet auto-expands on relaunch with existing tasks)
- stopApp
- launchApp
- runFlow: common/dismiss-context-sheet.yaml
- extendedWaitUntil:
    visible: 'Task: Email plumber. Worth 5 stars. Card 1 of 1'
    timeout: 5000

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
