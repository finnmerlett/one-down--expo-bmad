# Story 3.1 — context toggle bar: tapping a context filter immediately
# re-filters the stack (AC2), multi-select shows tasks matching ANY active
# context (AC3), empty contexts grey out while OFF (AC4), and the selection
# persists across an app restart (AC5). Tasks are tagged one at a time right
# after creation (the newest task is always the top card), so the flow never
# depends on multi-card ordering.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml

# Seed 'Water plants' and tag it Home via the card back
- runFlow:
    file: common/add-task.yaml
    env:
      TITLE: 'Water plants'
- tapOn: 'Task: Water plants. Card 1 of 1'
- waitForAnimationToEnd
- tapOn: 'Context: Home'
- tapOn: 'Back to card front'
- waitForAnimationToEnd

# Seed 'Email plumber' (newest -> top card) and tag it Phone
- runFlow:
    file: common/add-task.yaml
    env:
      TITLE: 'Email plumber'
- tapOn: 'Task: Email plumber. Card 1 of 2'
- waitForAnimationToEnd
- tapOn: 'Context: Phone'
- tapOn: 'Back to card front'
- waitForAnimationToEnd

# AC2: filtering to Home leaves only the Home-tagged task, immediately
- tapOn: 'Filter context: Home'
- assertVisible: 'Task: Water plants. Card 1 of 1'
- takeScreenshot: .claude/run-notes/screenshots/3-1-context-filtered

# AC3 multi-select: adding Phone brings both back (newest sorts first)
- tapOn: 'Filter context: Phone'
- assertVisible: 'Task: Email plumber. Card 1 of 2'

# Un-tap Home -> only the Phone-tagged task remains
- tapOn: 'Filter context: Home'
- assertVisible: 'Task: Email plumber. Card 1 of 1'

# AC4: a context with no matching browsable tasks is disabled while OFF
- assertVisible:
    text: 'Filter context: Laptop'
    enabled: false

# AC5: the selection persists across a restart (plain relaunch, NO clearState)
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'Task: Email plumber. Card 1 of 1'
    timeout: 5000

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
