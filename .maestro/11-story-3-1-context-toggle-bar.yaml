# Story 3.1 — context toggle bar: tapping a context filter immediately
# re-filters the stack (AC2), multi-select shows tasks matching ANY active
# context (AC3), empty contexts grey out while OFF (AC4), and the selection
# persists across an app restart (AC5).
# Updated for Story 3.3: curation order is seed-jittered, so 'Water plants'
# is sized Quick win while it is the only card — the momentum rule then pins
# it as the top card and one swipe deterministically reaches the other task.
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml

# Seed 'Water plants' alone: tag it Home + make it a quick win
- runFlow:
    file: common/add-task.yaml
    env:
      TITLE: 'Water plants'
- tapOn: 'Edit task: Water plants'
- waitForAnimationToEnd
- tapOn: 'Context: Home'
- tapOn: 'Size: Quick win'
- tapOn: 'Back to card front'
- waitForAnimationToEnd

# Seed 'Email plumber'; momentum keeps Water plants on top, so one swipe
# reaches the new card to tag it Phone
- runFlow:
    file: common/add-task.yaml
    env:
      TITLE: 'Email plumber'
- swipe:
    start: 80%, 45%
    end: 5%, 45%
- waitForAnimationToEnd
- tapOn: 'Edit task: Email plumber'
- waitForAnimationToEnd
- tapOn: 'Context: Phone'
- tapOn: 'Back to card front'
- waitForAnimationToEnd

# AC2: filtering to Home leaves only the Home-tagged task, immediately
- tapOn: 'Filter context: Home'
- assertVisible: 'Task: Water plants. Worth 10 stars. Card 1 of 1'
- takeScreenshot: .claude/run-notes/screenshots/3-1-context-filtered

# AC3 multi-select: adding Phone brings both back (quick win on top)
- tapOn: 'Filter context: Phone'
- assertVisible: 'Task: Water plants. Worth 10 stars. Card 1 of 2'

# Un-tap Home -> only the Phone-tagged task remains
- tapOn: 'Filter context: Home'
- assertVisible: 'Task: Email plumber. Worth 10 stars. Card 1 of 1'

# AC4: a context with no matching browsable tasks is disabled while OFF
- assertVisible:
    text: 'Filter context: Laptop'
    enabled: false

# AC5: the selection persists across a restart (plain relaunch, NO clearState)
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'Task: Email plumber. Worth 10 stars. Card 1 of 1'
    timeout: 5000

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
