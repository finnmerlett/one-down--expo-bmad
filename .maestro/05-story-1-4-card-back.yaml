# Story 1.4 → v1.5 D5 — card back "edit in place" (frame 06): the pencil
# opens the EDITING CARD view (title over a hairline, DETAILS, deadline /
# requires / size groups), text auto-saves on blur, context toggles + size
# persist immediately, and `Done editing` (or the hardware back) contracts to
# the front which reflects the edits. Notes moved to the working screen (D5).
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml

# Seed one task via quick add (v1.5: the plus circle opens the sheet directly)
- tapOn: 'Add a task'
- waitForAnimationToEnd
- tapOn: 'Task title'
- inputText: 'Edit me task'
- tapOn: 'Save task'
- extendedWaitUntil:
    visible: 'What needs doing?'
    timeout: 3000
- tapOn: 'Close add task'
- waitForAnimationToEnd

# Pencil -> the card back expands with the v1.5 chrome (AC1-3)
- tapOn: 'Edit task: Edit me task'
- waitForAnimationToEnd
- assertVisible: 'Back to card front'
- assertVisible: 'Editing card'
- assertVisible: 'No deadline'
- assertVisible: 'Details'
- assertVisible: 'Done editing'
# Start/Cut loose/notes left the back in v1.5 (working screen owns them)
- assertNotVisible: 'Start'
- assertNotVisible: 'Cut loose'

# Inline title edit; auto-save on blur (AC4)
- longPressOn: 'Task title'
# Select all via the selection menu — cursor-position-proof (the 1.15 type
# scale moved the tap-center inside the text; plain eraseText left residue)
- tapOn: 'Select all'
- eraseText
- inputText: 'Edited task title'
# Dismiss the keyboard BEFORE tapping chips: with the soft keyboard up they
# can sit underneath it (Maestro's hierarchy doesn't model IME occlusion).
# BUT the emulator IME sometimes runs with no soft keyboard on screen; there
# Maestro's hideKeyboard falls back to a BACK key event, which the card-back
# BackHandler treats as "close the card", flushing drafts on unmount.
# Handle both modes: hideKeyboard, then reopen the card if it closed. The
# reopen tap's exact label doubles as proof the title edit was saved.
- hideKeyboard
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: 'Back to card front'
    commands:
      - tapOn: 'Edit task: Edited task title'
      - waitForAnimationToEnd

# Context toggle + size persist immediately (AC5, AC6). The groups can sit
# below the fold on small screens — scroll them into view first.
- scrollUntilVisible:
    element:
      text: 'Context: Home'
    direction: DOWN
- tapOn: 'Context: Home'
- tapOn: 'Size: Quick win'

# Done editing -> contracts to the front, which reflects every edit (AC7):
# new title in the card label, size tag and context badge visible
- scrollUntilVisible:
    element:
      text: 'Done editing'
    direction: DOWN
- tapOn: 'Done editing'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Task: Edited task title. Worth 5 stars. Card 1 of 1'
    timeout: 3000
# v1.5 face: size renders as bottom-rail caps; contexts are GLYPHS (no text)
- assertVisible: 'QUICK WIN'

# Reopen: stored values survived the close. Close with the system back
# gesture this time — it must close the card, not exit the app (review fix:
# BackHandler in the overlay).
- tapOn: 'Edit task: Edited task title'
- waitForAnimationToEnd
- assertVisible: 'Editing card'
- back
- waitForAnimationToEnd
- assertVisible: 'Task: Edited task title. Worth 5 stars. Card 1 of 1'

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
