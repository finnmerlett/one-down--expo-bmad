# Story 5.3 — cloud sync round trip: local task → Postgres → fresh-install
# restore into an empty local DB.
# PREREQ: local supabase stack running AND `bun run server:dev` (migrations
# applied via `bun run --cwd apps/server db:migrate`).
appId: com.onedown.mobile
---
- runFlow: common/launch-app.yaml

# Create an account (unique per run — GoTrue keeps users across runs).
- evalScript: ${output.email = 'e2e-' + Date.now() + '@test.local'}
- tapOn: 'Open settings'
- tapOn: 'Create account'
- tapOn: 'Email'
- inputText: ${output.email}
- tapOn: 'Password'
- inputText: 'test-password-123'
- hideKeyboard
# 'Create account' matches BOTH the screen header and the submit button —
# index 1 targets the button (the header renders first in the tree).
- tapOn:
    text: 'Create account'
    index: 1
- extendedWaitUntil:
    visible: 'Signed in as ${output.email}'
    timeout: 10000
# The signed-in label appears while the auth->settings redirect is still
# settling — a tap fired mid-transition gets swallowed (seen in CI: the flow
# stayed on Settings and 'Add task' never appeared). Let the router finish.
- waitForAnimationToEnd
- tapOn: 'Back to home'

# Add a task and let the debounced sync drain (v1.5: the 'Add a task' plus
# circle opens the quick-add sheet directly).
- tapOn: 'Add a task'
- waitForAnimationToEnd
- tapOn: 'Task title'
- inputText: 'Sync me task'
- tapOn: 'Save task'
- tapOn: 'Close add task'
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: 'Sync pending'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Sync retrying'
    timeout: 15000

# Fresh install: clearState wipes SQLite + secure store. Home must be empty.
- launchApp:
    clearState: true
- assertVisible: 'No tasks yet'

# Sign back in — the pull restores the account's tasks into the empty DB.
- tapOn: 'Open settings'
- tapOn: 'Sign in'
- tapOn: 'Email'
- inputText: ${output.email}
- tapOn: 'Password'
- inputText: 'test-password-123'
- hideKeyboard
# Header/button ambiguity again ('Sign in' x2) — index 1 is the button.
- tapOn:
    text: 'Sign in'
    index: 1
- extendedWaitUntil:
    visible: 'Signed in as ${output.email}'
    timeout: 10000
# Same settling wait as the first leg — don't tap mid-redirect.
- waitForAnimationToEnd
- tapOn: 'Back to home'
- extendedWaitUntil:
    visible: 'Task: Sync me task. Worth 10 stars. Card 1 of 1'
    timeout: 15000
- takeScreenshot: .maestro/screenshots/5-3-task-restored-from-cloud

- assertNotVisible: 'Unhandled'
- assertNotVisible: 'error occurred'
